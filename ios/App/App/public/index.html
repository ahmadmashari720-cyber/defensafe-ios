<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DefenSafe</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      overflow: hidden;
    }
    iframe {
      border: none;
      width: 100%;
      height: calc(100% - env(safe-area-inset-top));
      margin-top: env(safe-area-inset-top);
    }
  </style>
</head>
<body>
  <iframe src="https://system.defensafe.com/" allow="geolocation *; camera *; microphone *"></iframe>
</body>
</html>
