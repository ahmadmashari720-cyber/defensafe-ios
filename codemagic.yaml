workflows:
  ios-app:
    name: Build DefenSafe iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Build Xcode Archive
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath $CM_BUILD_DIR/build/DefenSafe.xcarchive archive
      - name: Export Unsigned IPA
        script: |
          cd $CM_BUILD_DIR/build/DefenSafe.xcarchive/Products/Applications
          mkdir Payload
          cp -r *.app Payload/
          zip -r $CM_BUILD_DIR/DefenSafe.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/*.ipa