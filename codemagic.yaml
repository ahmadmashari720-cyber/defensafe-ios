workflows:
  ios-app:
    name: Build DefenSafe iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install CocoaPods Dependencies
        script: |
          cd ios/App
          pod install
      - name: Build Xcode Archive
        script: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" | head -n 1)
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          
          if [ -n "$WORKSPACE_PATH" ]; then
            echo "Building with workspace: $WORKSPACE_PATH"
            xcodebuild -workspace "$WORKSPACE_PATH" \
                       -scheme App \
                       -configuration Release \
                       -sdk iphoneos \
                       -archivePath $CM_BUILD_DIR/build/DefenSafe.xcarchive \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO \
                       archive
          elif [ -n "$PROJECT_PATH" ]; then
            echo "Building with project: $PROJECT_PATH"
            xcodebuild -project "$PROJECT_PATH" \
                       -scheme App \
                       -configuration Release \
                       -sdk iphoneos \
                       -archivePath $CM_BUILD_DIR/build/DefenSafe.xcarchive \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO \
                       archive
          fi
      - name: Export Unsigned IPA
        script: |
          cd $CM_BUILD_DIR/build/DefenSafe.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r $CM_BUILD_DIR/DefenSafe.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/*.ipa