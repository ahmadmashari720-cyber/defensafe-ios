workflows:
  ios-app:
    name: Build DefenSafe iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install Dependencies and Sync Native iOS
        script: |
          npm install --legacy-peer-deps
          npx cap sync ios
      - name: Build Xcode Archive
        script: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            echo "Building with App.xcworkspace"
            xcodebuild clean archive -workspace App.xcworkspace \
                       -scheme App \
                       -configuration Release \
                       -sdk iphoneos \
                       -archivePath $CM_BUILD_DIR/build/DefenSafe.xcarchive \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGN_IDENTITY="" \
                       EXPANDED_CODE_SIGN_IDENTITY="" \
                       COMPILER_INDEX_STORE_ENABLE=NO
          else
            echo "Building with App.xcodeproj"
            xcodebuild clean archive -project App.xcodeproj \
                       -scheme App \
                       -configuration Release \
                       -sdk iphoneos \
                       -archivePath $CM_BUILD_DIR/build/DefenSafe.xcarchive \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGN_IDENTITY="" \
                       EXPANDED_CODE_SIGN_IDENTITY="" \
                       COMPILER_INDEX_STORE_ENABLE=NO
          fi
      - name: Export Unsigned IPA
        script: |
          cd $CM_BUILD_DIR/build/DefenSafe.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r $CM_BUILD_DIR/DefenSafe.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/*.ipa