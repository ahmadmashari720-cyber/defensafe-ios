workflows:
  ios-app:
    name: Build DefenSafe iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install Dependencies and Sync Native iOS
        script: |
          npm install
          npx cap sync ios
      - name: Build Xcode Archive
        script: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" | head -n 1)
          echo "Found workspace at: $WORKSPACE_PATH"
          
          xcodebuild -workspace "$WORKSPACE_PATH" \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath $CM_BUILD_DIR/build/DefenSafe.xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     archive
      - name: Export Unsigned IPA
        script: |
          cd $CM_BUILD_DIR/build/DefenSafe.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r $CM_BUILD_DIR/DefenSafe.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/*.ipa